# Solarctic-Zen – CI für Dart/Flutter-Tests und Android-Build.
# iOS/watchOS werden über Codemagic gebaut (siehe codemagic.yaml, ADR-015).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.50.0"

jobs:
  test:
    name: Analyse & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter --disable-analytics
      - run: flutter pub get
      - name: Formatierung prüfen
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Statische Analyse
        run: flutter analyze
      - name: Tests
        run: flutter test

  android:
    name: Android-Build (Debug)
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter --disable-analytics
      - run: flutter pub get
      - run: flutter build apk --debug
