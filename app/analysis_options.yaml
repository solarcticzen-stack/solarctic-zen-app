# Statische Analyse für Solarctic-Zen. Strenger als der Flutter-Standard,
# damit Fehler früh auffallen (siehe CLAUDE.md, Qualitätsanforderungen).
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    unawaited_futures: error
    avoid_dynamic_calls: error
  exclude:
    - build/**
    - android/**
    - ios/**
    - "**/*.g.dart"
    - web/**

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_print
    - directives_ordering
    - prefer_const_constructors
    - prefer_final_locals
    - prefer_single_quotes
    - unawaited_futures
    - use_super_parameters
